[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
node = "24.22.1"
kind = "0.33.0"
helm = "4.3.1"
kubectl = "1.37.1"
"github:kube-rs/kopium" = "0.24.1"

[tasks.check]
description = "Format check, lints and tests"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets --locked -- -D warnings",
  "cargo test --locked",
]
