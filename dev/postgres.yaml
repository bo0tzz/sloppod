apiVersion: v1
kind: Secret
metadata:
  name: sloppod-db
stringData:
  uri: postgres://sloppod:sloppod@postgres:5432/sloppod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - {name: POSTGRES_USER, value: sloppod}
            - {name: POSTGRES_PASSWORD, value: sloppod}
            - {name: POSTGRES_DB, value: sloppod}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, sloppod]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
