image:
  repository: ghcr.io/bo0tzz/sloppod
  tag: dev
  pullPolicy: Never
session:
  image:
    repository: ghcr.io/bo0tzz/sloppod-session
    tag: dev
    pullPolicy: Never
  storage:
    size: 5Gi
  memory: 3Gi
database:
  existingSecret: sloppod-db
