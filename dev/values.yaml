image:
  repository: ghcr.io/bo0tzz/sloppod
  tag: dev
  pullPolicy: Never
session:
  image:
    repository: ghcr.io/bo0tzz/sloppod-session
    tag: dev
    pullPolicy: Never
  storage:
    size: 5Gi
  memory: 3Gi
  model: claude-haiku-5-5
  defaultMode: auto
database:
  existingSecret: sloppod-db
masterKey:
  existingSecret: sloppod-master-key
auth:
  defaultUser: dev
memory:
  namespacePrefix: dev/
