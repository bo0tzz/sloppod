[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/bo0tzz/sloppod"

[workspace.dependencies]
sloppod-contracts = { path = "crates/contracts" }
sloppod-protocol = { path = "crates/protocol" }

agent-client-protocol-schema = "1.12.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
envoy-types = "0.7.7"
futures = "0.3.34"
graphql-parser = "0.4.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "chrono", "json", "migrate", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
rustls = "0.23.46"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
