[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/bo0tzz/sloppod"

[workspace.dependencies]
sloppod-contracts = { path = "crates/contracts" }
sloppod-protocol = { path = "crates/protocol" }

anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
