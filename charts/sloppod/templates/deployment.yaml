{{- if or (not .Values.database.existingSecret) (not .Values.masterKey.existingSecret) }}
{{- fail "database.existingSecret and masterKey.existingSecret are required" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sloppod.fullname" . }}
  labels:
    {{- include "sloppod.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Live session state is in memory; one runtime at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sloppod.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sloppod.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sloppod.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            - name: SLOPPOD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SLOPPOD_SERVICE
              value: {{ include "sloppod.fullname" . }}
            - name: SLOPPOD_RUNTIME_SELECTOR
              value: app.kubernetes.io/name=sloppod,app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=runtime
            - name: SLOPPOD_CA_SECRET
              value: {{ include "sloppod.caSecret" . }}
            - name: SLOPPOD_SESSION_IMAGE
              value: "{{ .Values.session.image.repository }}:{{ .Values.session.image.tag | default .Chart.AppVersion }}"
            - name: SLOPPOD_SESSION_IMAGE_PULL_POLICY
              value: {{ .Values.session.image.pullPolicy }}
            - name: SLOPPOD_SESSION_SERVICE_ACCOUNT
              value: {{ include "sloppod.sessionServiceAccount" . }}
            - name: SLOPPOD_SESSION_STORAGE_SIZE
              value: {{ .Values.session.storage.size | quote }}
            {{- with .Values.session.storage.storageClass }}
            - name: SLOPPOD_SESSION_STORAGE_CLASS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.session.cpu }}
            - name: SLOPPOD_SESSION_CPU
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.session.memory }}
            - name: SLOPPOD_SESSION_MEMORY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.session.directHosts }}
            - name: SLOPPOD_DIRECT_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: SLOPPOD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.masterKey.existingSecret }}
                  key: {{ .Values.masterKey.secretKey }}
            - name: SLOPPOD_USER_HEADER
              value: {{ .Values.auth.userHeader | quote }}
            {{- with .Values.auth.defaultUser }}
            - name: SLOPPOD_DEFAULT_USER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.memory.namespacePrefix }}
            - name: SLOPPOD_MEMINI_NAMESPACE_PREFIX
              value: {{ . | quote }}
            {{- end }}
            - name: SLOPPOD_GIT_NAME
              value: {{ .Values.git.name | quote }}
            - name: SLOPPOD_GIT_EMAIL
              value: {{ .Values.git.email | quote }}
            {{- if .Values.instructions }}
            - name: SLOPPOD_INSTRUCTIONS_FILE
              value: /etc/sloppod/config/instructions.md
            {{- end }}
            - name: SLOPPOD_ENVOY_TRUSTED_CA
              value: {{ .Values.envoyTrustedCA | quote }}
          ports:
            - name: http
              containerPort: 8080
            - name: sessions
              containerPort: 8081
            - name: authz
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/sloppod/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "sloppod.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
