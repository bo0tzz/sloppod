image:
  repository: ghcr.io/bo0tzz/sloppod
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

session:
  image:
    repository: ghcr.io/bo0tzz/sloppod-session
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  storage:
    size: 20Gi
    storageClass: ""
  cpu: ""
  memory: 4Gi
  # Hosts sessions may reach without the authorizer, e.g. package registries. Empty keeps the built-in list. A `*`
  # matches within one DNS label, e.g. `productionresultssa*.blob.core.windows.net`.
  directHosts: []

# Postgres connection URI, from an existing Secret (e.g. CloudNativePG's `<cluster>-app`, key `uri`).
database:
  existingSecret: ""
  secretKey: uri

# 32 random bytes, base64 (e.g. `openssl rand -base64 32`), encrypting the credentials sloppod stores (ADR 21).
# Losing it makes them unreadable. Claude accounts, GitHub Apps and memini are added in the UI.
masterKey:
  existingSecret: ""
  secretKey: master-key

# Users come from the authenticating proxy in front of sloppod (ADR 23).
auth:
  # Header carrying the user's name.
  userHeader: x-forwarded-user
  # User for requests without that header; leave empty to refuse them.
  defaultUser: ""
  # Origins besides sloppod's own a browser may open /acp from, e.g. https://ui.example.com.
  allowedOrigins: []

memory:
  # Prepended to every memory namespace, e.g. `dev/` for a test install.
  namespacePrefix: ""

# Rendered into every work session as the agent's user-level instructions (CLAUDE.md), ahead of each user's own,
# which they set in Settings.
instructions: ""

# CA bundle inside Cilium's Envoy for verifying real upstreams.
envoyTrustedCA: /etc/ssl/certs/ca-certificates.crt

# The cluster's DNS domain. Sessions can look up names under it, and otherwise only the hosts they may reach.
clusterDomain: cluster.local

# The runtime's ServiceAccount; defaults to the release's full name. Override it when something else, like a
# CloudNativePG cluster of the same name, already owns that ServiceAccount.
serviceAccount:
  name: ""

logLevel: info,sloppod=debug

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  # Restrict the runtime's ingress: the authorizer port only from Cilium's Envoy, the API from these entities.
  enabled: true
  httpFrom: [cluster, ingress]

# The LiteLLM operator (home-operations/litellm-operator, #461): sessions are offered the models of the LiteLLMProxy
# resources in these namespaces, and each session on one gets a LiteLLMVirtualKey of its own in the release's
# namespace. Left unset, it's the release's own namespace; `[]` leaves the operator alone. Where the operator isn't
# installed, the runtime says so once and looks again every 10 minutes. Watching lets the runtime read every Secret in
# its own namespace, where the operator writes the keys it mints.
litellm:
  namespaces: ~
