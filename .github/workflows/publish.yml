name: Publish

# A `v<version>` tag publishes the release. main publishes `<last release, next patch>-main.<run>` charts on `:<sha>`
# images, which sort after the last release and before the next one, whatever its number.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Per ref, so a push to main never replaces a pending release. On main a newer push cancels the build in progress,
# so builds don't queue up behind each other; releases always finish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  # Both images in one job, one after the other, so the second reuses the first's Rust build.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/bo0tzz/sloppod:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/bo0tzz/sloppod:{0}', github.ref_name) || 'ghcr.io/bo0tzz/sloppod:main' }}
            ${{ github.ref_type == 'tag' && 'ghcr.io/bo0tzz/sloppod:latest' || '' }}
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=session
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build and push the session image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: session
          push: true
          tags: |
            ghcr.io/bo0tzz/sloppod-session:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/bo0tzz/sloppod-session:{0}', github.ref_name) || 'ghcr.io/bo0tzz/sloppod-session:main' }}
            ${{ github.ref_type == 'tag' && 'ghcr.io/bo0tzz/sloppod-session:latest' || '' }}
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=session
          cache-to: type=gha,mode=max,scope=session

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: helm
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            chart=$(awk '/^version:/ {print $2}' charts/sloppod/Chart.yaml)
            crates=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
            if [ "$chart" != "$version" ] || [ "$crates" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME doesn't match Chart.yaml ($chart) and Cargo.toml ($crates)" >&2
              exit 1
            fi
            app_version="$GITHUB_REF_NAME"
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            version="${major}.${minor}.$((patch + 1))-main.${GITHUB_RUN_NUMBER}"
            app_version="$GITHUB_SHA"
          fi
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/sloppod --version "$version" --app-version "$app_version" -d dist
          helm push "dist/sloppod-${version}.tgz" oci://ghcr.io/bo0tzz/charts
          echo "Published chart sloppod ${version} (images ${app_version})" >> "$GITHUB_STEP_SUMMARY"
