name: Publish

# main publishes `<version>-main.<run>` charts on `:<sha>` images; a `v<version>` tag publishes the release.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Per ref, so a push to main never replaces a pending release; on main only the newest pending build survives.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            image: ghcr.io/bo0tzz/sloppod
          - target: session
            image: ghcr.io/bo0tzz/sloppod-session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', matrix.image, github.ref_name) || format('{0}:main', matrix.image) }}
            ${{ github.ref_type == 'tag' && format('{0}:latest', matrix.image) || '' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: helm
      - name: Package and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(awk '/^version:/ {print $2}' charts/sloppod/Chart.yaml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v${base}" ]; then
              echo "tag $GITHUB_REF_NAME doesn't match the chart version $base" >&2
              exit 1
            fi
            version="$base"
            app_version="$GITHUB_REF_NAME"
          else
            version="${base}-main.${GITHUB_RUN_NUMBER}"
            app_version="$GITHUB_SHA"
          fi
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/sloppod --version "$version" --app-version "$app_version" -d dist
          helm push "dist/sloppod-${version}.tgz" oci://ghcr.io/bo0tzz/charts
          echo "Published chart sloppod ${version} (images ${app_version})" >> "$GITHUB_STEP_SUMMARY"
